</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="42" y="42" class="title">Hasse Diagram After Collapsing Alternative Identifiers</text>
<text x="42" y="66" class="subtitle">Alternative Identifier connections are merged into one class. Red entries inside a class preserve which relation caused the merge.</text>
<g transform="translate(42 88)"><line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/><text x="48" y="4" class="subtitle">Hasse cover edge after collapse</text><rect x="286" y="-10" width="16" height="16" rx="3" fill="#fff5f5" stroke="#dc2626"/><text x="312" y="4" class="subtitle">Alternative Identifier relation kept inside the class</text></g>

